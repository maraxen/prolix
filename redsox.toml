# redsox Tier B Static Control-Knob Governance Configuration (U1 + U5)
target_package = "prolix"
target_source_root = "src/prolix"
target_dataclasses = [
    "prolix.knob_surface.KnobSurface",
    "prolix.simulate.SimulationSpec",
    "prolix.physics.spec.PhysicsSpec",
    "prolix.physics.nonbonded_config.NonbondedConfig",
    "prolix.physics.nonbonded_config.NeighborListConfig",
]
consumer_module_globs = [
    "src/prolix/physics/**/*.py",
    "src/prolix/api/**/*.py",
    "src/prolix/pallas_kernels.py",
    "src/prolix/batched_energy.py",
    "src/prolix/batched_simulate.py",
]
vendor_source_root = "../naurmalade/src"
vendor_reference_classes = [
    "naurmalade.simulation.config.SimulationConfig",
    "naurmalade.simulation.config.EquilibrationConfig",
    "naurmalade.simulation.config.MinimizationConfig",
    "naurmalade.simulation.config.ProductionConfig",
    "naurmalade.simulation.config.ImplicitSolventConfig",
    "naurmalade.simulation.config.HMRConfig",
    "naurmalade.simulation.config.EnsembleConfig",
    "naurmalade.simulation.config.IntegratorConfig",
    "naurmalade.simulation.config.ForceFieldConfig",
    "naurmalade.simulation.config.NonbondedConfig",
    "naurmalade.simulation.config.BiasSpec",
    "naurmalade.minimization.restraints.RestraintSpec",
    "naurmalade.minimization.softcore.LambdaSchedule",
    "naurmalade.minimization.softcore.SoftcoreSweepStep",
    "naurmalade.cosolv.config.CosolvConfig",
    "naurmalade.cosolv.config.CosolvEntry",
]
sibling_parity_governed = false

[reachability]
config_classes = [
    "prolix.knob_surface.KnobSurface",
    "prolix.knob_surface.ThermostatControls",
    "prolix.knob_surface.BarostatControls",
    "prolix.knob_surface.NonbondedControls",
    "prolix.knob_surface.ImplicitSolventControls",
    "prolix.knob_surface.ConstraintControls",
    "prolix.knob_surface.CosolventControls",
    "prolix.knob_surface.SoftcoreRestraintControls",
    "prolix.knob_surface.CollectiveVariableBiasControls",
    "prolix.knob_surface.PallasControls",
    "prolix.simulate.SimulationSpec",
    "prolix.physics.spec.PhysicsSpec",
    "prolix.physics.nonbonded_config.NonbondedConfig",
    "prolix.physics.nonbonded_config.NeighborListConfig",
]
consumer_paths = [
    "src/prolix/physics",
    "src/prolix/api",
    "src/prolix/pallas_kernels.py",
    "src/prolix/batched_energy.py",
    "src/prolix/batched_simulate.py",
]
exclude_files = [
    "knob_surface.py",
    "nonbonded_config.py",
    "spec.py",
    "simulate.py",
]

[superset_parity]
target_dataclass = "prolix.knob_surface.KnobSurface"
sibling_parity_governed = false
vendor_reference_classes = [
    "naurmalade.simulation.config.SimulationConfig",
    "naurmalade.simulation.config.EquilibrationConfig",
    "naurmalade.simulation.config.MinimizationConfig",
    "naurmalade.simulation.config.ProductionConfig",
    "naurmalade.simulation.config.ImplicitSolventConfig",
    "naurmalade.simulation.config.HMRConfig",
    "naurmalade.simulation.config.EnsembleConfig",
    "naurmalade.simulation.config.IntegratorConfig",
    "naurmalade.simulation.config.ForceFieldConfig",
    "naurmalade.simulation.config.NonbondedConfig",
    "naurmalade.simulation.config.BiasSpec",
    "naurmalade.minimization.restraints.RestraintSpec",
    "naurmalade.minimization.softcore.LambdaSchedule",
    "naurmalade.minimization.softcore.SoftcoreSweepStep",
    "naurmalade.cosolv.config.CosolvConfig",
    "naurmalade.cosolv.config.CosolvEntry",
    "prolix.simulate.SimulationSpec",
    "prolix.physics.nonbonded_config.NonbondedConfig",
    "prolix.governance.redsox_adapter.PMEParams",
    "prolix.governance.redsox_adapter.ImplicitSolventParams",
]

