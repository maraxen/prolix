[experiment]
mode = "confirmation"
hypothesis = """
Prolix flash all-pairs energy/force matches vendored OpenMM 8.3.1 Reference gold
emitted with cutoff at least the longest MIC pair (not the 9 A NL cutoff).
"""
claim_discriminates = ["H_flash_allpairs_ok", "H_null_misspec"]
claim_isolates = ["C_flash_not_cutoff", "C_throughput"]

[outcomes.pass]
condition = "gate_pass = 1 AND ABS(delta_e_kcal) <= 0.1 AND force_rmse_kcal_mol_A < 3.0"
decision = "Flash vs all-pairs gold confirmed after tile-body JAX changes."
reasoning = "Separate gold from NL 9 A cutoff (lesson 379)."
is_residual = false

[outcomes.fail]
condition = "gate_pass = 0 OR ABS(delta_e_kcal) > 0.1 OR force_rmse_kcal_mol_A >= 3.0"
decision = "Do not treat flash scatter rewrite as physics-neutral."
reasoning = "Residual: missing gold or flash/OpenMM mismatch."
is_residual = true

[result_schema]
campaign_slug = "str"
probe = "str"
engine = "str"
oracle_path = "str"
oracle_sha256 = "str"
openmm_version = "str"
gate_pass = "int"
delta_e_kcal = "float"
force_rmse_kcal_mol_A = "float"
cutoff_angstrom = "float"
switch_distance_angstrom = "float"
skin_angstrom = "float"

[metadata]
campaign_slug = "nonbonded-omm-parity"
tags = ["nonbonded-omm-parity", "confirmation", "flash"]
