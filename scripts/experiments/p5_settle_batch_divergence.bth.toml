[experiment]
hypothesis = "Batched SETTLE divergence is caused by deterministic round disagreement under XLA FMA reassociation in PBC minimum-image wrapping sites: jnp.round() applies banker's rounding (round-half-to-even) which can select opposite directions on loop vs vmap paths when values lie within ULP of half-integers, displacing atomic positions. Replacement with jnp.floor(x+0.5) gives deterministic round-half-up independent of FMA order."

[outcomes.pass]
condition   = "max_abs_atom_position_delta < 1e-10"
decision    = "Conversions fix the identified hot regime deterministically"
reasoning   = "A constructed adversarial case targeting the half-integer tie point passes; N>=5 random seeds all pass. Frame/vmap equivalence is preserved to the tolerance."

[outcomes.fail]
condition   = "max_abs_atom_position_delta >= 1e-10"
decision    = "Primitive error persists; investigate alternative root cause"
reasoning   = "The fix is necessary-but-insufficient. Examine first-divergence dump: if primitive error is box-quantised, an unfound wrap site exists; if arbitrary-magnitude, re-weight toward H3/eigh."
is_residual = true

[result_schema]
batch_size                    = "int"
n_waters                      = "int"
box_size                      = "float"
steps                         = "int"
max_abs_atom_position_delta   = "float"
first_divergence_step         = "int"
offending_molecule_index      = "int"
o_pos_loop_pre                = "tuple[float, float, float]"
o_pos_vmap_pre                = "tuple[float, float, float]"
o_pos_loop_post               = "tuple[float, float, float]"
o_pos_vmap_post               = "tuple[float, float, float]"
delta_over_box_at_five_sites  = "dict[str, float]"
primitive_error_classification = "str"

