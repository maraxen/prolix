[experiment]
hypothesis = "PBC rounding sites in settle.py are UNREACHABLE by the round-vs-floor tie-point mechanism. Real suspect is test fixture: small_water_system places O at [0,0,0] and solute at [5,5,5] with box=[10,10,10] — exactly at wrap discontinuities — combined with test's shift_fn using jnp.round (banker's rounding) vs settle.py's floor(x+0.5). Stage 1 v2 tests: (A) G1'-TRANSLATION to move atoms off discontinuities (expected: no divergence), (B) G1''-BITEXACT ULP comparison at step 0 (expected: bit-identical), (C) G2 seeded comparison retained, (D) G1''' idiom-toggle non-gating control."

[outcomes.pass]
condition   = "max_abs_atom_position_delta < 1e-10"
decision    = "Batched SETTLE produces identical dynamics to unbatched on CPU; fixture geometry or rounding idiom mismatch is not causing divergence"
reasoning   = "Small 4-atom system on CPU float64 should produce machine-identical trajectories; any divergence >= 1e-10 indicates a real primitive error in constraint code"

[outcomes.fail]
condition   = "max_abs_atom_position_delta >= 1e-10"
decision    = "Divergence detected; classify by magnitude (box-quantized vs ULP vs arbitrary) and source (fixture vs batch vs code)"
reasoning   = "Divergence at any scale is unexpected on CPU; investigate whether fixture geometry, batch asymmetry, or PBC rounding sites are responsible"
is_residual = true

