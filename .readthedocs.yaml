# Read the Docs configuration file for Prolix
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_install:
      - "${READTHEDOCS_VIRTUALENV_PATH}/bin/pip install --upgrade pip"
      - "${READTHEDOCS_VIRTUALENV_PATH}/bin/pip install 'openmmtools @ git+https://github.com/choderalab/openmmtools.git'"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - openmm
